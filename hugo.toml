baseURL = "https://batuking1111.github.io/"
locale = 'en-us'
title = "Batuhan Personal Blog"
theme = "stack"
[params]
    mainSections = ["post"]
    featuredImageField = "image"

    [params.sidebar]
        emoji = "🧠"
        subtitle = "Founder of AlphaRayCorp"
        avatar = "img/avatar.jpg"
    [[params.sidebar.social]]
        name = "github"
        url = "https://github.com/Batuking1111"

    [[params.sidebar.social]]
        name = "alpha-ray-corp"
        url = "https://github.com/alpharaycorp"

    [[params.sidebar.social]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/batuhanerkann/"
    [params.widgets]
      # homepage as array of widget objects (each widget must have a `type` key)
      homepage = [
        { type = "search" },
        { type = "archives" },
        { type = "categories" },
        { type = "tag-cloud" }
      ]